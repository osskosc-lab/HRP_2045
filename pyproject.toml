[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hrp-2045"
version = "1.0.0"
description = "Model-independent Hachioji Rendezvous Protocol reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hrp = "hrp.cli:main"

[tool.setuptools.packages.find]
include = ["hrp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
