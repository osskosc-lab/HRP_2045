name: HRP Phase 1A Falsification

on:
  push:
    branches:
      - agent/hrp-phase1a-falsification
    paths:
      - "experiments/phase1a/**"
      - "tests/test_phase1a.py"
      - ".github/workflows/phase1a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Harness regression tests
        run: python -m pytest -q
      - name: Frozen Phase 1A execution
        run: python experiments/phase1a/run_phase1a.py --seeds 200 --out results/phase1a
      - name: Scientific decision gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("results/phase1a/phase1a_results.json").read_text())
          print("decision:", r["decision"])
          if r["decision"] != "NOT_FALSIFIED_PHASE1A":
              raise SystemExit(1)
          PY
      - name: Upload frozen result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrp-phase1a-results
          path: results/phase1a/
          if-no-files-found: error
          retention-days: 90
